spring:
  application:
    name: duxusdesafio

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/duxus_desafio}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true